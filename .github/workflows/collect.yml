
name: Refresh Job Radar public job feeds
on:
  schedule:
    - cron: '17 12,17,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-radar-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python collector.py
      - name: Commit changed feed only
        run: |
          git config user.name 'job-radar-bot'
          git config user.email 'job-radar-bot@users.noreply.github.com'
          git add jobs.json feed-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Job Radar public job feeds'
            git push
          fi
